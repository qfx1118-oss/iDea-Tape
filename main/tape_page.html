<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>iDea Tape · 录音带</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5dfcd;color:#292a26;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;padding:48px 24px 60px;margin:auto}header{border-bottom:2px solid #292a26;display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:16px}h1{font-size:30px;letter-spacing:-1px;margin:0}header span{font:12px monospace;color:#706c5c}h2{font-size:21px;margin:0 0 4px}.intro{display:grid;grid-template-columns:1fr 160px;gap:28px;align-items:center;padding:30px 0}p{margin:8px 0;color:#6b6758}.cassette{height:100px;background:#292a26;border-radius:9px;padding:12px;box-shadow:0 3px 0 #a49b80}.band{height:23px;background:#c26738;color:#f0e9d7;font:11px/23px monospace;padding-left:8px}.wheels{display:flex;justify-content:space-between;background:#161a15;border-radius:30px;margin-top:9px;padding:5px 10px}.wheel{height:30px;width:30px;border:7px solid #c8bfa7;border-radius:50%;outline:2px solid #6a583d}.toolbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #aaa48e;padding:14px 0}button,a.download{border:1px solid #aaa48e;border-radius:4px;background:transparent;padding:8px 13px;color:#292a26;cursor:pointer;font:inherit;text-decoration:none;white-space:nowrap}button:hover,a.download:hover{background:#d5ccb5}button:disabled{opacity:.45;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #c26738;outline-offset:3px}.row{display:grid;grid-template-columns:1fr auto;gap:16px;border-bottom:1px solid #bdb59e;padding:22px 0;align-items:center}.name{font:600 18px monospace}.meta{font-size:13px;color:#77705e}.actions{display:flex;gap:8px}.download{background:#292a26!important;color:#eee7d5!important;border-color:#292a26!important}#status{font-size:13px;min-height:24px;margin-top:14px}audio{display:block;width:100%;margin:14px 0}footer{padding-top:24px;font-size:12px;color:#77705e}.empty{padding:45px 0;text-align:center}#player[hidden]{display:none}@media(max-width:480px){main{padding:28px 20px}.intro{grid-template-columns:1fr}.cassette{display:none}.row{grid-template-columns:1fr}.actions{justify-content:flex-start}header span{font-size:10px}h1{font-size:27px}}
</style><main><header><h1>iDea Tape</h1><span>POCKET CASSETTE / SIDE A</span></header><section class="intro"><div><h2>把想法，带回电脑。</h2><p>试听录音，下载通用 WAV 文件。<br>传输期间请保持设备热点连接。</p></div><div class="cassette" aria-hidden="true"><div class="band">iDea / NORMAL TYPE I</div><div class="wheels"><div class="wheel"></div><div class="wheel"></div></div></div></section><div class="toolbar"><span id="count">正在读取录音带…</span><button id="refresh" type="button">刷新列表</button></div><p id="status" role="status" aria-live="polite"></p><section id="player" hidden><div id="playing"></div><audio id="audio" controls></audio></section><div id="list"></div><footer>文件保存在录音笔内。下载不会删除原录音。<br>完成后长按设备 OK 键退出导出，再连接回日常 Wi-Fi。此热点无需互联网。</footer></main>
<script>
const $=id=>document.getElementById(id);let objectURL=null,busy=false;
const label=id=>'iDea-Tape-'+String(id).padStart(8,'0');
const duration=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function load(){
 if(busy)return;$('refresh').disabled=true;$('status').textContent='';
 try{const r=await fetch('/api/tapes',{cache:'no-store'});if(!r.ok)throw Error();const files=await r.json();$('list').replaceChildren();$('count').textContent=files.length+' 段录音';
 if(!files.length){const p=document.createElement('p');p.className='empty';p.textContent='录音带还是空的。回到设备，录下第一个想法。';$('list').append(p)}
 for(const f of files){const row=document.createElement('article');row.className='row';const info=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=label(f.id);const meta=document.createElement('div');meta.className='meta';meta.textContent=duration(f.seconds)+' · '+(f.bytes/1048576).toFixed(2)+' MB · WAV / 16 kHz';info.append(name,meta);const actions=document.createElement('div');actions.className='actions';const play=document.createElement('button');play.textContent='试听';play.type='button';play.setAttribute('aria-label','试听 '+label(f.id));play.onclick=()=>listen(f,play);const a=document.createElement('a');a.href='/audio/'+f.id+'.wav';a.download=label(f.id)+'.wav';a.className='download';a.textContent='下载 WAV';a.setAttribute('aria-label','下载 '+label(f.id));actions.append(play,a);row.append(info,actions);$('list').append(row)}
 }catch(e){$('status').textContent='连接中断。请确认电脑仍连接 iDea-Tape 热点，再刷新。'}finally{$('refresh').disabled=false}
}
async function listen(f,button){if(busy)return;busy=true;button.disabled=true;$('refresh').disabled=true;$('status').textContent='正在读取 '+label(f.id)+'…';
 try{const r=await fetch('/audio/'+f.id+'.wav');if(!r.ok)throw Error();const blob=await r.blob();if(blob.size!==f.bytes)throw Error();$('audio').pause();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);$('audio').src=objectURL;$('playing').textContent=label(f.id);$('player').hidden=false;$('status').textContent='录音已载入，点击播放器播放。';try{await $('audio').play();$('status').textContent='正在试听。'}catch(e){}
 }catch(e){$('status').textContent='读取失败。请保持热点连接，再试一次。'}finally{busy=false;button.disabled=false;$('refresh').disabled=false}
}
$('refresh').onclick=load;load();
</script></html>
